<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon</title>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- fontawsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- tail -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- faavic -->
    <link
      rel="shortcut icon"
      href="https://www.freepnglogos.com/uploads/pokeball-png/pokeball-alexa-style-blog-pokemon-inspired-charmander-daily-8.png"
      type="image/x-icon"
    />
    <style>
      html {
        scroll-behavior: smooth;
      }
      ::-webkit-scrollbar {
        width: 9px;
        background-color: black;
        border-radius: 0px 100px 100px 0px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
        border: 1px solid gold;
        border-radius: 0px 100px 100px 0px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: gold;
        border-radius: 0px 100px 100px 0px;
      }
      @media (max-width: 640px) {
        ::-webkit-scrollbar {
          width: 5px;
          background-color: black;
          border-radius: 0px 100px 100px 0px;
        }
      }
      .delete-slide {
        animation: slideLeft 500ms ease forwards;
      }

      @keyframes slideLeft {
        to {
          transform: translateX(-120px);
          opacity: 0;
        }
      }

      .delete-shrink {
        animation: shrinkHeight 400ms ease forwards;
      }

      @keyframes shrinkHeight {
        to {
          height: 0;
          padding-top: 0;
          padding-bottom: 0;
          margin-top: 0;
          margin-bottom: 0;
          border-width: 0;
        }
      }
    </style>
  </head>
  <body
    class="bg-black"
    style="font-family: &quot;Sour Gummy&quot;, sans-serif"
  >
    <header
      class="flex justify-center items-center mb-2 border-b-1 border-[gold]"
      style="font-family: &quot;Bubblegum Sans&quot;, sans-serif"
    >
      <h1 class="text-[45px] font-bold text-[yellow] tracking-widest inline">
        P
      </h1>
      <img
        class="w-[29px] me-1"
        src="https://www.freepnglogos.com/uploads/pokeball-png/pokeball-alexa-style-blog-pokemon-inspired-charmander-daily-8.png"
        alt="o"
      />
      <h1 class="text-[45px] font-bold text-[yellow] tracking-widest inline">
        kemon
      </h1>
      <div class="h-17 overflow-hidden p-1">
        <img
          class="h-full w-full object-contain"
          src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ix/champions/25.webp"
          alt=""
        />
      </div>
    </header>

    <main
      class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-7 gap-1"
    >
      <aside
        class="bg-black col-span-1 sm:col-span-2 md:col-span-2 lg:col-span-2 border-1 border-yellow-300 mx-1 sm:mx-2 max-h-[80vh] rounded-[6px] sm:rounded-[9px] relative overflow-hidden text-sm sm:text-lg"
      >
        <div
          id="cards"
          class="flex flex-col rounded-[5px] sm:rounded-[10px] divide-y-1 divide-yellow-300 tracking-wider overflow-auto max-h-[76vh] overflow-x-hidden pb-[40px] me-[-1px]"
        ></div>
        <div
          class="bg-black h-[40px] flex justify-between items-center bg-yellow-300 absolute bottom-0 left-0 right-0 rounded-[0_0_4px_4px] sm:rounded-[0_0_8px_8px] ps-[1px] border-t-1 border-[gold] text-black font-semibold"
        >
          <button
            onclick="previousBtnClick()"
            class="w-[50%] ms-[-1px] hover:text-sm hover:bg-[black] hover:text-[yellow] h-full flex justify-center items-center active:text-[gold] active:bg-[black] cursor-pointer"
          >
            <i class="fa-solid fa-angles-left"></i>
            <div class="hidden sm:block">PREVIOUS</div>
          </button>
          <button
            onclick="nextBtnClick()"
            class="w-[50%] hover:text-sm hover:bg-[black] hover:text-[yellow] active:text-[gold] active:bg-[black] h-full flex justify-center items-center cursor-pointer"
          >
            <div class="hidden sm:block">NEXT</div>
            <i class="fa-solid fa-angles-right"></i>
          </button>
        </div>
      </aside>

      <div class="col-span-2 sm:col-span-3 md:col-span-4 lg:col-span-5 mx-2">
        <div class="flex h-20 justify-center items-center sm:gap-4">
          <div class="relative min-w-0 w-[300px]">
            <input
              class="h-[50px] rounded-[25px_0_0_25px] sm:rounded-full px-5 font-semibold text-yellow-300 w-full focus:outline-none tracking-wide border-1 border-yellow-300 bg-black focus:border-2"
              type="search"
              id="search"
              placeholder="Search Pokemon"
              autocomplete="off"
            />
            <ul id="suggestions" class="hidden"></ul>
          </div>
          <button
            onclick="onSearchBtnClick()"
            type="button"
            class="text-yellow-300 font-semibold py-[9px] px-2 sm:px-4 rounded-[0_25px_25px_0] sm:rounded-full ms-[-1px] border-2 border-yelllow-300 text-lg hover:bg-yellow-300 hover:text-black hover:border-yellow-300 active:text-[gold] active:bg-black cursor-pointer"
          >
            Search
          </button>
        </div>

        <div
          class="flex justify-center items-center h-[60vh]"
          id="pokemon"
        ></div>
      </div>
    </main>
  </body>
  <script src="./script.js"></script>
</html>
