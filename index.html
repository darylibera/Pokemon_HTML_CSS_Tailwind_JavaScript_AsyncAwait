<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon</title>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- fontawsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- tail -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- faavic -->
    <link
      rel="shortcut icon"
      href="https://www.freepnglogos.com/uploads/pokeball-png/pokeball-alexa-style-blog-pokemon-inspired-charmander-daily-8.png"
      type="image/x-icon"
    />
    <style>
      html {
        scroll-behavior: smooth;
      }
      ::-webkit-scrollbar {
        width: 9px;
        background-color: black;
        border-radius: 0px 100px 100px 0px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
        border: 1px solid gold;
        border-radius: 0px 100px 100px 0px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: gold;
        border-radius: 0px 100px 100px 0px;
      }
      @media (max-width: 640px) {
        ::-webkit-scrollbar {
          width: 5px;
          background-color: black;
          border-radius: 0px 100px 100px 0px;
        }
      }
    </style>
  </head>
  <body
    class="bg-black"
    style="font-family: &quot;Sour Gummy&quot;, sans-serif"
  >
    <header
      class="flex justify-center items-center"
      style="font-family: &quot;Bubblegum Sans&quot;, sans-serif"
    >
      <h1 class="text-[45px] font-bold text-[yellow] tracking-widest inline">
        P
      </h1>
      <img
        class="w-[29px] me-1"
        src="https://www.freepnglogos.com/uploads/pokeball-png/pokeball-alexa-style-blog-pokemon-inspired-charmander-daily-8.png"
        alt="o"
      />
      <h1 class="text-[45px] font-bold text-[yellow] tracking-widest inline">
        kemon
      </h1>
      <div class="h-17 overflow-hidden p-1">
        <img
          class="h-full w-full object-contain"
          src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ix/champions/25.webp"
          alt=""
        />
      </div>
    </header>

    <main
      class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-7 gap-1"
    >
      <aside
        class="col-span-1 sm:col-span-2 md:col-span-2 lg:col-span-2 border-1 border-yellow-300 mx-1 sm:mx-2 max-h-[80vh] rounded-[6px] sm:rounded-[9px] relative overflow-hidden text-sm sm:text-lg"
      >
        <div
          id="cards"
          class="flex flex-col rounded-[5px] sm:rounded-[10px] divide-y-1 divide-yellow-300 tracking-wider overflow-auto max-h-[76vh] overflow-x-hidden pb-[40px] me-[-1px]"
        ></div>
        <div
          class="bg-black h-[40px] flex justify-between items-center bg-yellow-300 absolute bottom-0 left-0 right-0 rounded-[0_0_4px_4px] sm:rounded-[0_0_8px_8px] ps-[1px] border-t-1 border-[gold] text-black font-semibold"
        >
          <button
            onclick="previousBtnClick()"
            class="w-[50%] ms-[-1px] hover:text-sm hover:bg-[black] hover:text-[gold] h-full flex justify-center items-center active:text-[black] active:bg-[gold] cursor-pointer"
          >
            <i class="fa-solid fa-angles-left"></i>
            <div class="hidden sm:block">PREVIOUS</div>
          </button>
          <button
            onclick="nextBtnClick()"
            class="w-[50%] hover:text-sm hover:bg-[black] hover:text-[gold] active:text-[black] active:bg-[gold] h-full flex justify-center items-center cursor-pointer"
          >
            <div class="hidden sm:block">NEXT</div>
            <i class="fa-solid fa-angles-right"></i>
          </button>
        </div>
      </aside>

      <div class="col-span-2 sm:col-span-3 md:col-span-4 lg:col-span-5 mx-2">
        <div class="flex h-20 justify-center items-center sm:gap-4">
          <input
            class="w-[300px] h-[50px] rounded-[25px_0_0_25px] sm:rounded-full px-5 font-semibold text-yellow-300 min-w-0 focus:outline-none tracking-wide border-1 border-yellow-300 bg-black focus:border-2"
            type="search"
            id="search"
            placeholder="Search Pokemon"
          />
          <button
            onclick="onSearchBtnClick()"
            type="button"
            class="text-yellow-300 font-semibold py-[9px] px-4 rounded-[0_25px_25px_0] sm:rounded-full ms-[-1px] border-2 border-yelllow-300 text-lg hover:bg-yellow-300 hover:text-black hover:border-yellow-300 active:text-[gold] active:bg-black cursor-pointer"
          >
            Search
          </button>
        </div>

        <div
          class="flex justify-center items-center h-[60vh]"
          id="pokemon"
        ></div>
      </div>
    </main>
  </body>
  <script>
    const resetCard = () => {
      document.querySelector("#pokemon").innerHTML = `<article
            class="bg-[url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIyzju-j4SeCeblby7-l0dNuq1DiHNGawq5mIcWK9GyawNZbCCyopoqeU&s=10')] bg-cover min-h-90 min-w-30 max-w-60 grow rounded-sm border-2 border-[gold]/30 outline-2 outline-[gold] outline-offset-4 flex flex-col items-center justify-evenly px-2 relative"
          > 
            <div style="
            font-family: 'Bubblegum Sans', sans-serif;
                clip-path: polygon(
                  2% 50%,
                  8% 15%,
                  15% 15%,
                  15% 0%,
                  85% 0%,
                  85% 15%,
                  92% 15%,
                  98% 50%,
                  92% 85%,
                  100% 85%,
                  85% 85%,
                  85% 100%,
                  15% 100%,
                  15% 85%,
                  8% 85%
                );
              "
              class="w-full font-bold flex justify-center items-center h-8 text-[14px] bg-linear-to-t from-black via-[red] to-black border-1 border-[gold] text-[gold] mb-[-12px] tracking-wider z-4 text-shadow-[0_0_2px_black] inset-shadow-[0px_0px_10px_red]"
              id="pokemonName"
            > 
              NAME
            </div>
            <div
              class="bg-black h-35 w-full rounded-xl overflow-hidden flex items-end justify-center px-1 pt-1 border-1 border-[gold] relative"
              id="image"
            >
              <img
                class="h-full w-full object-contain z-5"
                src="https://www.freepnglogos.com/uploads/pokeball-png/pokeball-alexa-style-blog-pokemon-inspired-charmander-daily-8.png"
                alt="pokemon"
              />
             <div class=" absolute top-1 left-1 bg-linear-to-t from-[white] to-[red] rounded-full text-[9px] tracking-wide text-[black]   font-bold leading-none px-1  z-1">TYPE</div>

            <div class="absolute top-0 right-0 z-3 bg-linear-to-tl from-[black] via-[green] to-[gold] h-6 w-7 rounded-[0_10px] text-sm flex items-center justify-evenly px-[1px] text-white border-1 border-[gold] text-[11px] leading-none italic me-[-1px] mt-[-1px] ">0</div>

            </div>
            
            <div
              class="w-full min-h-10 rounded-lg border-2 border-[gold] flex justify-evenly items-center text-white text-[12px] bg-linear-55 from-black/0 via-[green] to-black/0 divide-x-1 divide-[gold]"
            >
              <div class="w-full text-center" id="height">
                <i class="fa-solid fa-up-long text-[gold]"></i> Height
              </div>

              <div class="w-full text-center" id="ability">
                <i class="fa-brands fa-superpowers text-[gold]"></i> Ability
              </div>
            </div>
            <div
              style="
                clip-path: polygon(
                  0% 5%,
                  5% 5%,
                  4% 0%,
                  96% 0%,
                  95% 5%,
                  100% 5%,
                  100% 95%,
                  95% 95%,
                  96% 100%,
                  4% 100%,
                  5% 95%,
                  0% 95%
                );
              "
              class="w-full min-h-30 rounded-lg text-center text-sm bg-[white]/90  pb-1 border-2 border-[gold]"
            >
              <h6 class="my-1 text-green-700 text-shadow-[0_1px_1px_black] ">
                ---- STATS ----
              </h6>
              <div class="grid grid-cols-14 gap-1 h-20">
                <div
                  class="h-full flex flex-col justify-between items-center col-span-2"
                >
                  <div class="flex items-center">
                    <i class="fa-solid fa-heart text-[red]"></i>
                  </div>
                  <div class="flex items-center grid-col-3">
                    <i class="fa-solid fa-hand-fist text-orange-500"></i>
                  </div>
                  <div class="flex items-center grid-col-3">
                    <i class="fa-solid fa-shield text-green-700"></i>
                  </div>
                  <div class="flex items-center grid-col-3">
                    <i class="fa-solid fa-person-running text-yellow-400"></i>
                  </div>
                </div>
                <div
                  class="flex flex-col justify-evenly gap-3 items-center col-span-10"
                  id="chart"
                >
                  <div
                    class="flex items-center bg-black h-2 w-full rounded-full"
                  >
                    <div class="bg-[red] w-[0%] h-full rounded-full"></div>
                  </div>
                  <div
                    class="flex items-center bg-black h-2 w-full rounded-full"
                  >
                    <div class="bg-orange-500 w-[0%] h-full rounded-full"></div>
                  </div>
                  <div
                    class="flex items-center bg-black h-2 w-full rounded-full"
                  >
                    <div class="bg-green-700 w-[0%] h-full rounded-full"></div>
                  </div>
                  <div
                    class="flex items-center bg-black h-2 w-full rounded-full"
                  >
                    <div class="bg-yellow-400 w-[0%] h-full rounded-full"></div>
                  </div>
                </div>
                <div
                  class="col-span-2 flex flex-col justify-between items-center gap-1 leading-none"
                  id="percentage"
                >
                  <span>0</span>
                  <span>0</span>
                  <span>0</span>
                  <span>0</span>
                </div>
              </div>
            </div>
          </article>`;
    };
    resetCard();

    const home = "https://pokeapi.co/api/v2/pokemon/";
    let previousPage = null;
    let nextPage = null;
    const maxStats = { hp: 255, attack: 190, defence: 230, speed: 200 };

    const getData = async (page) => {
      try {
        let apiResponse = await fetch(`${page}`);
        if (!apiResponse.ok) {
          let cards = document.querySelector("#cards");
          cards.className =
            " w-full h-full rounded-[10px] bg-black flex justify-center items-center font-sans font-bold text-[30px] text-[grey]";
          cards.innerText = "!404 Page Not Found";
          return;
        }
        apiResponse = await apiResponse.json();
        let results = apiResponse.results;
        nextPage = apiResponse.next;
        previousPage = apiResponse.previous;

        let cards = document.querySelector("#cards");
        cards.innerHTML = "";
        results.map(
          (each) =>
            (cards.innerHTML += `<button onclick="onNameClick(this)" class=" py-2 px-0 sm:p-2 rounded-[10px] bg-linear-to-b from-yellow-300/30 via-black to-black mb-2 text-yellow-300 text-center cursor-pointer  hover:bg-yellow-300 sm:hover:text-xl hover:text-[15px] 
            active:bg-[green]" >
            ${each.name}
        </button>`),
        );
      } catch (error) {
        console.log(error);
      }
    };
    getData(home);

    const cardDisplay=async(search)=>{
      try {
        let apiResponse = await fetch(
          `https://pokeapi.co/api/v2/pokemon/${search}`,
        );
        if (!apiResponse.ok) {
          resetCard();
          alert("Enter A Listed Name");
          return;
        }
        apiResponse = await apiResponse.json();

        const imageChoosing = () => {
          const image1 =
            apiResponse.sprites.versions["generation-ix"].champions
              .front_default;
          const image2 =
            apiResponse.sprites.versions["generation-viii"]["sword-shield"]
              .front_default;
          const image3 =
            apiResponse.sprites.versions["generation-viii"][
              "brilliant-diamond-shining-pearl"
            ].front_default;
          const image4 =
            apiResponse.sprites.versions["generation-ix"]["legends-za"]
              .front_default;
          const image5 =
            apiResponse.sprites.versions["generation-ix"]["scarlet-violet"]
              .front_default;
          const image6 =
            apiResponse.sprites.versions["generation-viii"]["legends-arceus"]
              .front_default;

          if (image1) {
            return image1;
          } else if (image2) {
            return image2;
          } else if (image3) {
            return image3;
          } else if (image4) {
            return image4;
          } else if (image5) {
            return image5;
          } else if (image6) {
            return image6;
          } else {
            return apiResponse.sprites.other.home.front_default;
          }
        };

        document.getElementById("image").innerHTML = `<img
                class="h-full w-full object-contain z-2"
                src="${imageChoosing()}"
                alt="pokemon"
              />
             <div class=" absolute top-1 left-1 bg-linear-to-t from-[white] to-[red] rounded-full text-[9px] tracking-wide text-[black]   font-bold leading-none px-1 z-1">${apiResponse.types[0].type.name.toUpperCase()}</div> 

             <div class="absolute top-0 right-0 z-3 bg-linear-to-tl from-[black] via-[green] to-[gold] h-6 w-7 rounded-[0_10px] text-sm flex items-center justify-evenly px-[1px] text-white border-1 border-[gold] text-[11px] leading-none italic me-[-1px] mt-[-1px]">${apiResponse.id}</div>`;

        document.querySelector("#pokemonName").innerText = apiResponse.name;
        document.querySelector("#height").innerHTML =
          `<i class="fa-solid fa-up-long text-[gold] "></i> ${apiResponse.height}`;
        document.querySelector("#ability").innerHTML =
          `<i class="fa-brands fa-superpowers text-[gold] "></i> ${apiResponse.abilities[0].ability.name}`;
        document.querySelector("#chart").innerHTML =
          `<div class="flex items-center bg-black h-2 w-full rounded-full" >
                        <div class="bg-[red] w-[${(apiResponse.stats[0].base_stat / maxStats.hp) * 100}%] h-full rounded-full "></div>
                        </div>
            <div class="flex items-center bg-black h-2 w-full rounded-full">
                            <div class="bg-orange-500 w-[${(apiResponse.stats[1].base_stat / maxStats.attack) * 100}%] h-full rounded-full "></div>
                        </div>
            <div class="flex items-center bg-black h-2 w-full rounded-full">
                            <div class="bg-green-700 w-[${(apiResponse.stats[2].base_stat / maxStats.defence) * 100}%] h-full rounded-full "></div>
                        </div>
            <div class="flex items-center bg-black h-2 w-full rounded-full">
                            <div class="bg-yellow-400 w-[${(apiResponse.stats[5].base_stat / maxStats.speed) * 100}%] h-full rounded-full "></div>
                        </div>`;

        document.querySelector("#percentage").innerHTML =
          `<span>${apiResponse.stats[0].base_stat}</span>
                  <span>${apiResponse.stats[1].base_stat}</span>
                  <span>${apiResponse.stats[2].base_stat}</span>
                  <span>${apiResponse.stats[5].base_stat}</span>`;
      } catch (error) {
        
      }
    }

    const nextBtnClick = () => {
      if (nextPage) {
        getData(nextPage);
      }
    };

    const previousBtnClick = () => {
      if (previousPage) {
        getData(previousPage);
      }
    };

    const onSearchBtnClick = async () => {
      try {
        let search = document.querySelector("#search").value;

        if (!search) {
          return;
        }
        cardDisplay(search)
        
      } catch (error) {
        console.log(error);
      }
    };

    const onNameClick=(buttonName)=>{
      let btnName= buttonName.innerText
      cardDisplay(btnName)
    }

  </script>
</html>
